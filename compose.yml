x-application: &application
  image: realplay-tournaments:local
  environment:
    DATABASE_URL: ${DATABASE_URL:-postgresql://realplay:realplay@postgres:5432/realplay?schema=public}
    REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    PORT: ${API_PORT:-3000}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-realplay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-realplay}
      POSTGRES_DB: ${POSTGRES_DB:-realplay}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-realplay} -d ${POSTGRES_DB:-realplay}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - db-network

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - redis-network

  migrate:
    <<: *application
    build:
      context: .
    command: ["npm", "run", "prisma:deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - db-network

  api:
    <<: *application
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + process.env.PORT + '/health').then(response => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    ports:
      - "${API_PORT:-3000}:${API_PORT:-3000}"
    restart: unless-stopped
    networks:
      - db-network
      - redis-network

  worker:
    <<: *application
    command: ["node", "dist/worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - db-network
      - redis-network

networks:
  db-network:
    name: db-network
    driver: bridge
  redis-network:
    name: redis-network
    driver: bridge

volumes:
  postgres-data:
    name: postgres-data
  redis-data:
    name: redis-data
